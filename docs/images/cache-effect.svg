<text x="48" y="744" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">첫 요청 100개는 둘 다 원본까지 가서 이득이 없어요 (p50 끔 225.1~234.5ms, 켬 232.4~242.0ms). 이득은 같은 키를 다시 읽을 때 나와요.</text>
<text x="48" y="770" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Windows 11, 논리 코어 14개, Python 3.14.7에서 잰 값이에요. 다른 컴퓨터에서는 절대값이 달라지고 방향만 같아요.</text>
