<text x="600" y="698" font-size="15" text-anchor="middle" fill="#6b7280"><tspan font-weight="700" fill="#c2570c">무거운 쿼리는 p50 약 11~13배 빨라지고, 가벼운 쿼리는 오히려 느려요</tspan>  DB 호출은 둘 다 2,000 → 0</text>
<text x="48" y="744" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">가벼운 쿼리는 DB가 3.4ms에 끝내는데, 캐시를 켜면 Mini Redis까지 HTTP로 한 번 더 왕복해야 해서 느려졌어요(원인은 짐작이에요).</text>
<text x="48" y="770" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">macOS(Apple Silicon, 코어 10개), Python 3.13, PostgreSQL 16(Docker, 같은 컴퓨터)에서 잰 값이에요. 다른 컴퓨터에서는 절대값이 달라지고 방향만 같아요.</text>
