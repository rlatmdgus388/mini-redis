<text x="48" y="72" font-size="30" font-weight="700" fill="#111318" text-anchor="start">성능 측정 결과: 실제 PostgreSQL 앞에서</text>
<text x="48" y="102" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">같은 요청 2,000개를 캐시 없이(매번 DB) / Mini Redis를 앞에 두고 보냈어요. 3번 반복했고 막대 하나가 한 번의 결과예요.</text>
