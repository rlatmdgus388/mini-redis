<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>

  <!-- 라벨: 요청 경로 -->
  <text x="40" y="44" font-size="20" font-weight="700" fill="#0f172a">요청 하나가 지나는 길</text>

  <!-- 1 클라이언트 -->
  <rect x="40" y="70" width="240" height="130" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="160" y="112" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">클라이언트</text>
  <text x="160" y="142" font-size="16" text-anchor="middle" fill="#475569">단어장 앱, curl 등</text>
  <text x="160" y="168" font-size="16" text-anchor="middle" fill="#475569">HTTP + JSON</text>

  <!-- 2 API -->
  <rect x="340" y="70" width="240" height="130" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="340" cy="70" r="18" fill="#3b82f6"/><text x="340" y="77" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">1</text>
  <text x="460" y="112" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3a8a">API</text>
  <text x="460" y="142" font-size="16" text-anchor="middle" fill="#1e40af">FastAPI</text>
  <text x="460" y="168" font-size="16" text-anchor="middle" fill="#1e40af">입력만 검증 (키·값·TTL)</text>

  <!-- 3 Store -->
  <rect x="640" y="70" width="240" height="130" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="640" cy="70" r="18" fill="#f59e0b"/><text x="640" y="77" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">2</text>
  <text x="760" y="112" font-size="22" font-weight="700" text-anchor="middle" fill="#78350f">Store</text>
  <text x="760" y="142" font-size="16" text-anchor="middle" fill="#92400e">전역 RLock 하나로</text>
  <text x="760" y="168" font-size="16" text-anchor="middle" fill="#92400e">명령을 한 번에 하나씩</text>

  <!-- 4 HashTable -->
  <rect x="940" y="70" width="220" height="130" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <circle cx="940" cy="70" r="18" fill="#22c55e"/><text x="940" y="77" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">3</text>
  <text x="1050" y="112" font-size="22" font-weight="700" text-anchor="middle" fill="#14532d">HashTable</text>
  <text x="1050" y="142" font-size="16" text-anchor="middle" fill="#166534">직접 구현한 저장소</text>
  <text x="1050" y="168" font-size="16" text-anchor="middle" fill="#166534">체이닝 · FNV-1a</text>

  <!-- 요청 화살표 -->
  <line x1="282" y1="120" x2="336" y2="120" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <line x1="582" y1="120" x2="636" y2="120" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <line x1="882" y1="120" x2="936" y2="120" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <!-- 응답 화살표 -->
  <path d="M1050 202 V232 H160 V204" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#g)"/>
  <text x="600" y="252" font-size="16" text-anchor="middle" fill="#64748b">응답: 값과 남은 TTL, 없거나 만료되면 404 KEY_NOT_FOUND</text>

  <!-- 쓰기 설명 -->
  <text x="760" y="296" font-size="16" text-anchor="middle" fill="#92400e">쓰기(SET)는 AOF 버퍼에 먼저 적고, 그다음 저장</text>

  <!-- 구분선 -->
  <line x1="40" y1="324" x2="1160" y2="324" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 백그라운드 -->
  <text x="40" y="364" font-size="20" font-weight="700" fill="#0f172a">락 밖에서 따로 도는 스레드</text>
  <text x="330" y="364" font-size="16" fill="#64748b">요청을 막지 않는다. 디스크 I/O는 전부 여기서 한다.</text>

  <!-- 만료 -->
  <rect x="40" y="390" width="340" height="120" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="210" y="428" font-size="20" font-weight="700" text-anchor="middle" fill="#7f1d1d">만료 스레드</text>
  <text x="210" y="458" font-size="16" text-anchor="middle" fill="#991b1b">100ms마다 타이밍 휠에서</text>
  <text x="210" y="482" font-size="16" text-anchor="middle" fill="#991b1b">만료된 키를 꺼내 삭제 (최대 1,000개)</text>

  <!-- AOF -->
  <rect x="430" y="390" width="340" height="120" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="600" y="428" font-size="20" font-weight="700" text-anchor="middle" fill="#4c1d95">AOF 스레드</text>
  <text x="600" y="458" font-size="16" text-anchor="middle" fill="#5b21b6">버퍼를 파일에 쓰고</text>
  <text x="600" y="482" font-size="16" text-anchor="middle" fill="#5b21b6">1초마다 fsync</text>

  <!-- 스냅샷 -->
  <rect x="820" y="390" width="340" height="120" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="990" y="428" font-size="20" font-weight="700" text-anchor="middle" fill="#4c1d95">스냅샷 스레드</text>
  <text x="990" y="458" font-size="16" text-anchor="middle" fill="#5b21b6">5분마다 또는 AOF 10MB 초과 시</text>
  <text x="990" y="482" font-size="16" text-anchor="middle" fill="#5b21b6">스냅샷을 뜨고 옛 AOF 삭제</text>

  <!-- 위로 향하는 연결 -->
  <path d="M210 388 V340" fill="none" stroke="#475569" stroke-width="0"/>

  <!-- 기동 -->
  <rect x="40" y="540" width="1120" height="40" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="566" font-size="16" text-anchor="middle" fill="#334155"><tspan font-weight="700">서버 시작할 때:</tspan> 스냅샷을 읽고 → AOF를 순서대로 재생 → 만료된 항목은 건너뛰고 → 끝나면 스레드와 서버 시작</text>
</svg>
