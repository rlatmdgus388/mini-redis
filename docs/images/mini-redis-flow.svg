<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#101828" flood-opacity="0.10"/></filter>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16794a"/></marker>
</defs>
<rect width="1200" height="660" rx="28" fill="#dde1e8"/>
<rect x="10" y="10" width="1180" height="640" rx="24" fill="#ffffff" filter="url(#sh)"/>
<text x="48" y="72" font-size="30" font-weight="700" fill="#111318" text-anchor="start">요청 하나가 지나는 길</text>
<text x="48" y="102" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">요청은 API, Store, HashTable 순서로 한 방향으로만 흐르고, 디스크 작업은 락 밖의 스레드가 맡아요.</text>
<rect x="48" y="136" width="236" height="150" rx="14" fill="#fff" stroke="#e1e3e8" filter="url(#sh)"/>
<text x="70" y="168" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">요청을 보내는 쪽</text>
<text x="70" y="214" font-size="27" font-weight="700" fill="#111318" text-anchor="start">클라이언트</text>
<text x="70" y="244" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">단어장 앱, curl</text>
<text x="70" y="264" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">HTTP + JSON</text>
<rect x="344" y="136" width="236" height="150" rx="14" fill="#fff" stroke="#e1e3e8" filter="url(#sh)"/>
<circle cx="356" cy="136" r="16" fill="#f97316"/><text x="356" y="142" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="366" y="168" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">입력만 검증</text>
<text x="366" y="214" font-size="27" font-weight="700" fill="#111318" text-anchor="start">API</text>
<text x="366" y="244" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">FastAPI</text>
<text x="366" y="264" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">키 256B · 값 1MB · TTL</text>
<rect x="640" y="136" width="236" height="150" rx="14" fill="#fff0e4" stroke="#f97316" filter="url(#sh)"/>
<circle cx="652" cy="136" r="16" fill="#f97316"/><text x="652" y="142" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="662" y="168" font-size="13" font-weight="400" fill="#c2570c" text-anchor="start">명령 실행</text>
<text x="662" y="214" font-size="27" font-weight="700" fill="#111318" text-anchor="start">Store</text>
<text x="662" y="244" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">전역 RLock 하나로</text>
<text x="662" y="264" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">한 번에 하나씩</text>
<rect x="936" y="136" width="216" height="150" rx="14" fill="#d6f5e3" stroke="#16794a" filter="url(#sh)"/>
<circle cx="948" cy="136" r="16" fill="#f97316"/><text x="948" y="142" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="958" y="168" font-size="13" font-weight="400" fill="#16794a" text-anchor="start">저장</text>
<text x="958" y="214" font-size="27" font-weight="700" fill="#111318" text-anchor="start">HashTable</text>
<text x="958" y="244" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">직접 구현한 저장소</text>
<text x="958" y="264" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">체이닝 · FNV-1a</text>
<line x1="286" y1="211" x2="340" y2="211" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="582" y1="211" x2="636" y2="211" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="878" y1="211" x2="932" y2="211" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M1048 290 V322 H168 V290" fill="none" stroke="#16794a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#g)"/>
<rect x="320" y="308" width="580" height="28" rx="14" fill="#d6f5e3"/>
<text x="610" y="327" font-size="14" font-weight="700" fill="#16794a" text-anchor="middle">응답: 값과 남은 TTL · 없거나 만료되면 404 KEY_NOT_FOUND</text>
<text x="48" y="372" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">쓰기(SET)는 AOF 버퍼에 먼저 적고, 그다음 해시테이블에 저장해요. TTL이 있으면 타이밍 휠에 만료 시각을 등록해요.</text>
<text x="48" y="424" font-size="20" font-weight="700" fill="#111318" text-anchor="start">락 밖에서 따로 도는 스레드</text>
<text x="48" y="446" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">요청을 막지 않아요. 디스크 I/O는 전부 여기서 해요.</text>
<rect x="48" y="466" width="344" height="104" rx="14" fill="#fff" stroke="#e1e3e8" filter="url(#sh)"/>
<text x="70" y="494" font-size="13" font-weight="700" fill="#c2570c" text-anchor="start">100ms마다</text>
<text x="70" y="526" font-size="22" font-weight="700" fill="#111318" text-anchor="start">만료 스레드</text>
<text x="70" y="552" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">타이밍 휠에서 만료된 키를 꺼내 삭제 (최대 1,000개)</text>
<rect x="428" y="466" width="344" height="104" rx="14" fill="#fff" stroke="#e1e3e8" filter="url(#sh)"/>
<text x="450" y="494" font-size="13" font-weight="700" fill="#c2570c" text-anchor="start">1초마다</text>
<text x="450" y="526" font-size="22" font-weight="700" fill="#111318" text-anchor="start">AOF 스레드</text>
<text x="450" y="552" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">버퍼를 파일에 쓰고 fsync</text>
<rect x="808" y="466" width="344" height="104" rx="14" fill="#fff" stroke="#e1e3e8" filter="url(#sh)"/>
<text x="830" y="494" font-size="13" font-weight="700" fill="#c2570c" text-anchor="start">5분마다 또는 AOF 10MB 초과</text>
<text x="830" y="526" font-size="22" font-weight="700" fill="#111318" text-anchor="start">스냅샷 스레드</text>
<text x="830" y="552" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">스냅샷을 뜨고 옛 AOF 삭제</text>
<rect x="48" y="590" width="1104" height="44" rx="14" fill="#fff0e4" stroke="#f97316" filter="url(#sh)"/>
<text x="600" y="618" font-size="14" text-anchor="middle" fill="#6b7280"><tspan font-weight="700" fill="#c2570c">서버 시작할 때</tspan>  스냅샷 읽기 → AOF 순서대로 재생 → 만료된 항목 건너뛰기 → 스레드와 서버 시작</text>
</svg>
